name: Update Web Feature Metadata

on:
  schedule:
    - cron: "0 0 * * 0" # Runs every Sunday at midnight
  workflow_dispatch:

jobs:
  update-metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get recent commits
        id: source-info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="web-platform-dx/web-features-mappings"

          RELEASE=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/releases/latest")

          RELEASE_TAG=$(echo "$RELEASE" | jq -r '.tag_name // ""')
          RELEASE_URL=$(echo "$RELEASE" | jq -r '.html_url // ""')
          # Escape @ mentions to prevent notifying contributors when reposting release content
          RELEASE_NOTES=$(echo "$RELEASE" | jq -r '.body // "No release notes available."' \
            | sed -e 's/@\([a-zA-Z0-9_-]\)/@<!-- -->\1/g' \
              -e 's|/pull/\([0-9]\)|/pull<!-- -->/\1|g' \
              -e 's|/issues/\([0-9]\)|/issues<!-- -->/\1|g')

          # Escape @ mentions to prevent notifying contributors when reposting commit messages
          COMMITS=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/commits?path=mappings/combined-data.json&per_page=10" \
            | jq -r '
              [.[] |
              "- [`" + (.sha[:7]) + "`](" + .html_url + ") " + (.commit.message | split("\n")[0]) + " (" + (.commit.author.date[:10]) + ")"]
              | join("\n")' \
            | sed -e 's/@\([a-zA-Z0-9_-]\)/@<!-- -->\1/g' \
              -e 's|/pull/\([0-9]\)|/pull<!-- -->/\1|g' \
              -e 's|/issues/\([0-9]\)|/issues<!-- -->/\1|g')

          {
            echo "release_tag=$RELEASE_TAG"
            echo "release_url=$RELEASE_URL"
            echo "release_notes<<RNEOF"
            echo "$RELEASE_NOTES"
            echo "RNEOF"
            echo "commits<<CEOF"
            echo "$COMMITS"
            echo "CEOF"
          } >> $GITHUB_OUTPUT

      - name: Download latest metadata
        run: curl -o tools/data/combined-data.json https://raw.githubusercontent.com/web-platform-dx/web-features-mappings/main/mappings/combined-data.json

      - name: Generate PR body
        id: pr-body
        env:
          RELEASE_TAG: ${{ steps.source-info.outputs.release_tag }}
          RELEASE_URL: ${{ steps.source-info.outputs.release_url }}
          RELEASE_NOTES: ${{ steps.source-info.outputs.release_notes }}
          COMMITS: ${{ steps.source-info.outputs.commits }}
        run: |
          REPO="web-platform-dx/web-features-mappings"

          {
            echo "body<<PREOF"
            echo "This pull request updates the [web-features-mappings](https://github.com/$REPO) metadata to the latest version."
            echo ""
            echo "## Release Notes"
            echo "*Sourced from [web-features-mappings's releases](${RELEASE_URL:-https://github.com/$REPO/releases}).*"
            echo ""
            echo "$RELEASE_NOTES"
            echo ""
            echo "## Recent Commits"
            echo "*Sourced from [web-features-mappings's commits](https://github.com/$REPO/commits/main/mappings/combined-data.json).*"
            echo ""
            echo "$COMMITS"
            echo ""
            echo "---"
            echo "This PR was created by the [Update Web Feature Metadata](https://github.com/Technickel-Dev/baseline-mcp/actions/workflows/update-metadata.yml) workflow in the [baseline-mcp](https://github.com/Technickel-Dev/baseline-mcp) repository."
            echo "PREOF"
          } >> $GITHUB_OUTPUT

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update web-features metadata"
          title: "Update web-features metadata"
          body: ${{ steps.pr-body.outputs.body }}
          branch: "update-web-features-metadata"
          labels: automated
